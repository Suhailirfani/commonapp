{% extends 'base.html' %}

{% block title %}Edit Contestant - {{ institution.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="{% url 'core:contestant_list' institution.slug %}" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Contestants</a>
        <h2 style="font-size: 1.8rem; font-weight: 800; margin-top: 4px;">Edit Contestant: #{{ contestant.chest_no }} {{ contestant.name }}</h2>
    </div>
</div>

<div class="glass-card" style="max-width: 650px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Chest Number</label>
            <input type="number" name="chest_no" class="form-control" value="{{ contestant.chest_no }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ contestant.name }}" required>
        </div>

        <div class="form-group">
            <label class="form-label">Competition</label>
            <select name="competition_id" class="form-control" required>
                {% for comp in competitions %}
                <option value="{{ comp.id }}" {% if comp.id == contestant.competition.id %}selected{% endif %}>{{ comp.name }} ({{ comp.year }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Team / House</label>
            <select name="team_id" class="form-control" required>
                {% for t in teams %}
                <option value="{{ t.id }}" {% if t.id == contestant.team.id %}selected{% endif %}>{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category_id" class="form-control" required>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if cat.id == contestant.category.id %}selected{% endif %}>{{ cat.name }} {% if cat.is_common %}(Common Category){% endif %}</option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;">
            <a href="{% url 'core:contestant_list' institution.slug %}" class="btn-primary" style="background: rgba(255,255,255,0.08); box-shadow: none;">Cancel</a>
            <button type="submit" class="btn-success">
                <i class="fa-solid fa-save"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
